<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controller Sender · Realms</title>
  <meta name="theme-color" content="#130f0c" />
  <link rel="icon" href="https://play.realms.party/images/game-favicon.ico" />
  <link rel="apple-touch-icon" href="https://play.realms.party/images/game-apple-touch-icon-180x180.png" />
  <link rel="preload" href="https://play.realms.party/fonts/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="https://play.realms.party/">
      <img class="logo" src="https://play.realms.party/images/logos/realms-lockup.svg" alt="Realms" />
      <h1>Sender</h1>
    </a>
    <div class="identity">
      <span id="username" class="pill" hidden></span>
      <button id="address" class="pill mono" title="Click to copy" hidden></button>
      <button id="disconnect-btn" class="ghost" hidden>Disconnect</button>
    </div>
  </header>

  <section id="connect-card" class="card connect" hidden>
    <h2>Send tokens and NFTs from your Controller</h2>
    <p class="muted">Connect with your Cartridge passkey. You approve every send in the Controller popup.</p>
    <button id="connect-btn" class="primary">Connect Controller</button>
  </section>

  <main id="app" hidden>
    <section class="card" id="balances-card">
      <div class="card-head">
        <h2>Balances</h2>
        <div class="row-right">
          <span id="total-usd" class="muted"></span>
          <button id="refresh-btn" class="ghost" title="Refresh">⟳</button>
        </div>
      </div>
      <div id="balances" class="token-list">
        <p class="muted">Loading…</p>
      </div>
      <form id="add-token-form" class="inline-form">
        <input id="add-token-address" placeholder="Add token by address (0x…)" spellcheck="false" />
        <button class="ghost" type="submit">Add</button>
      </form>
      <div class="card-head sub"><h2>NFTs</h2></div>
      <div id="nfts" class="token-list">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <section class="card" id="send-card">
      <button type="button" id="send-head" class="card-head send-head">
        <h2>Send</h2>
        <span id="send-count" class="muted"></span>
      </button>
      <form id="send-form">
        <div id="selection" class="token-list selection"></div>
        <label>Recipient
          <input id="recipient" placeholder="0x… or @username" autocomplete="off" spellcheck="false" required />
          <span id="recipient-hint" class="muted small"></span>
        </label>
        <button type="submit" class="primary" id="send-btn" disabled>Send</button>
      </form>

      <details id="settings">
        <summary>Settings</summary>
        <form id="settings-form" class="inline-form">
          <input id="default-recipient" placeholder="Default recipient (0x…)" spellcheck="false" />
          <button class="ghost" type="submit">Save</button>
        </form>
      </details>
    </section>
  </main>

  <dialog id="confirm-modal">
    <h3>Confirm transfer</h3>
    <ul id="c-items"></ul>
    <dl>
      <dt>Recipient</dt><dd id="c-recipient" class="mono"></dd>
    </dl>
    <p id="c-atomic" class="muted small">All items go in one transaction. If one fails, none are sent.</p>
    <div class="modal-actions">
      <button id="c-cancel" class="ghost">Cancel</button>
      <button id="c-confirm" class="primary">Confirm &amp; send</button>
    </div>
  </dialog>

  <div id="toasts"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
